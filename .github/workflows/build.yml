name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Test
        run: go test ./...
      - name: Build Windows exe
        run: GOOS=windows GOARCH=amd64 go build -ldflags "-H windowsgui -s -w" -o NagaControl.exe .
      - name: Build probes
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o nagaprobe.exe ./cmd/nagaprobe
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o hookprobe.exe ./cmd/hookprobe
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o keypadprobe.exe ./cmd/keypadprobe
      - uses: actions/upload-artifact@v4
        with:
          name: NagaControl
          path: "*.exe"
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" NagaControl.exe --clobber
